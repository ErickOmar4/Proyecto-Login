<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="icon" href="img/logoito.png" >
  <!-- libreria de componentes visuales para el (carrusel)  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ErickOmar4/Componente_Visual@main/css/libreriaV.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-pagina">
    <section class="login-lado">
      <img src="img/logoito.png" alt="Logo del sistema" width="48" height="48">

      <!-- Carrusel de la librería -* -->
      <div data-ui-carousel
           data-images="img/logoito.png,img/ito.png"
           data-interval="4000"></div>

      <div>
        <h1>Control de usuarios y alumnos</h1>
        <p>Captura usuarios, registra alumnos y consulta su mayoría de edad en un solo lugar.</p>
      </div>
    </section>

    <section class="login-form">
      <form class="form-login" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="texto-suave">Ingresa tu correo y contraseña.</p>

        <div class="alerta alerta-error alerta-login" role="alert" hidden></div>

        <label class="campo">
          <span class="campo-titulo">Correo electrónico</span>
          <input class="control" type="email" name="correo" autocomplete="username" placeholder="nombre@correo.com">
          <small class="error"></small>
        </label>

        <label class="campo">
          <span class="campo-titulo">Contraseña</span>
          <span class="grupo">
            <input class="control" type="password" name="password"  placeholder="Mínimo 8 caracteres">
            <button class="ver-password" type="button" aria-label="Mostrar contraseña">
              <svg class="icono ojo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icono ojo-tachado" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
            </button>
          </span>
          <small class="error"></small>
        </label>

        <button type="submit" class="boton boton-marca boton-ancho">Entrar</button>
      </form>
    </section>
  </main>

  <!-- Validaciones (librería normal) y componentes visuales -->
  <script src="https://cdn.jsdelivr.net/gh/ErickOmar4/utileria2.js@main/js/utileria.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/ErickOmar4/Componente_Visual@main/js/librerIaV.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
